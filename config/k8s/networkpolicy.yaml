apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memory-hog-netpol
  namespace: memory-hog-ns
spec:
  podSelector:
    matchLabels:
      app: memory-hog
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    # Allow traffic from anywhere within the namespace
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    # Allow DNS resolution
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
