name: Main Release Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
        
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run Tests (Echo)
        run: echo "test"
        
      - name: Run Build (Echo)
        run: echo "build"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t local-myapp:${{ matrix.python-version }} .

      - name: Tag and Push Docker image
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          
          docker tag local-myapp:${{ matrix.python-version }} $IMAGE_ID:${{ matrix.python-version }}
          docker tag local-myapp:${{ matrix.python-version }} $IMAGE_ID:${{ matrix.python-version }}-${{ github.sha }}
          
          docker push $IMAGE_ID:${{ matrix.python-version }}
          docker push $IMAGE_ID:${{ matrix.python-version }}-${{ github.sha }}

      - name: Update GitOps Deployment Manifest
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          NEW_IMAGE="${IMAGE_ID}:${{ matrix.python-version }}-${{ github.sha }}"
          
          # Update the specific image tag for this Python version
          sed -i "s|image: .*:${{ matrix.python-version }}-.*|image: $NEW_IMAGE|g" ../k8s/deployment.yaml
          
          cd .. # go back to root of repo to run git commands
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(cd): update image tag for ${{ matrix.python-version }} to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          
          # Pull with rebase to minimize race conditions, then push (with retry)
          n=0
          until [ "$n" -ge 5 ]
          do
             git pull --rebase origin main && git push origin main && break
             n=$((n+1)) 
             sleep 5
          done
