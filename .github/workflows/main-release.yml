name: Main Release Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
        
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}
          fetch-depth: 0
        
        
      - name: Run Build (Echo)
        run: echo "build"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t local-myapp:${{ matrix.python-version }} .

      - name: Tag and Push Docker image
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          
          docker tag local-myapp:${{ matrix.python-version }} $IMAGE_ID:${{ matrix.python-version }}-${{ github.sha }}
          docker push $IMAGE_ID:${{ matrix.python-version }}-${{ github.sha }}

      - name: Update GitOps Deployment Manifest
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          NEW_IMAGE="${IMAGE_ID}:${{ matrix.python-version }}-${{ github.sha }}"
          MANIFEST_PATH="../config/k8s/deployment.yaml"
          
          # Update the specific image tag for this Python version
          sed -i "s|image: .*:${{ matrix.python-version }}-.*|image: $NEW_IMAGE|g" "$MANIFEST_PATH"
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add "$MANIFEST_PATH"
          
          # Only commit and push if changes were detected
          if ! git diff --staged --quiet; then
            git commit -m "chore(cd): update image tag for ${{ matrix.python-version }} to ${{ github.sha }} [skip ci]"
            
            # Pull with rebase to handle parallel matrix pushes, then push (with retry)
            n=0
            until [ "$n" -ge 5 ]
            do
               git pull --rebase origin main && git push origin main && break
               n=$((n+1))
               git rebase --abort 2>/dev/null || true
               sleep 5
            done
          else
            echo "No changes detected in deployment.yaml"
          fi
