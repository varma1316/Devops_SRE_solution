name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'app/**'
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./app
        
    # Implementing the matrix build strategy
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Marked optional in the assessment

      - name: Set up Python for SAST
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: SAST Scanning (Bandit)
        run: |
          pip install bandit
          bandit -r . -f custom
        continue-on-error: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t local-myapp:${{ matrix.python-version }} .

      - name: Container Image Vulnerability Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-myapp:${{ matrix.python-version }}'
          format: 'table'
          exit-code: '0' # Set to 1 if you want to block the build on high/critical vulnerabilities
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Tag and Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          # Ensure image ID is lowercase for GHCR
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          
          # Tag the local image with the registry path, python version, and git sha
          docker tag local-myapp:${{ matrix.python-version }} $IMAGE_ID:${{ matrix.python-version }}
          docker tag local-myapp:${{ matrix.python-version }} $IMAGE_ID:${{ matrix.python-version }}-${{ github.sha }}
          
          # Push to GitHub Container Registry
          docker push $IMAGE_ID:${{ matrix.python-version }}
          docker push $IMAGE_ID:${{ matrix.python-version }}-${{ github.sha }}

      - name: Update GitOps Deployment Manifest
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[A-Z]' '[a-z]')
          NEW_IMAGE="${IMAGE_ID}:${{ matrix.python-version }}-${{ github.sha }}"
          
          # Update the specific image tag for this Python version
          sed -i "s|image: .*:${{ matrix.python-version }}-.*|image: $NEW_IMAGE|g" ../config/k8s/deployment.yaml
          
          # Commit and push the changes back to the repository
          cd .. # go back to root of repo to run git commands
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add  config/k8s/deployment.yaml
          git commit -m "chore(cd): update image tag for ${{ matrix.python-version }} to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          
          # Pull with rebase to minimize race conditions, then push (with retry)
          n=0
          until [ "$n" -ge 5 ]
          do
             git pull --rebase origin master && git push origin master && break
             n=$((n+1)) 
             sleep 5
          done
